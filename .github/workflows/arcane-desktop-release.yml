name: Release Arcane Desktop

# Official four-platform Desktop build entrypoint — build only, never publishes.
# 分阶段发布·阶段 0（设计见 apps/desktop/docs/phased-release-design.md）：
# 阶段 1 Stage Arcane Desktop Release 上传 mac 产物；Windows 全程本机
# sign-windows.mjs 签名后 publish-release.mjs --finalize 收口。CI 全量发布
# （未签名 Windows 直接上线）的旧 publish job 已按拍板移除——紧急场景的答案是
# 不发。国际化方案 D5 发布双轨：每平台构建 cn（OSS）与 intl（R2）两个 flavor，
# intl 包名带 -intl 后缀、默认 releaseId 带 -intl 后缀，两侧 latest 互不影响。
# 2026-09 重构：Windows 腿整体撤出 CI（mac 仍必须云端——签名/公证凭证在
# secrets 里不可本地化；Windows 产物未签名本就不需要 CI），本机走
# scripts/build-windows-release.mjs 构建+校验，消掉构件跨境下载与签名等待。
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id (default: <version>-<commit8>)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arcane-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ inputs.release_id || '' }}

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.region }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ARCANE_RELEASE_ID: ${{ inputs.release_id }}
      ARCANE_SOURCE_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
            arch: arm64
            node_platform: darwin-arm64
            builder: dist:mac
            region: cn
          - platform: macos-arm64
            os: macos-14
            arch: arm64
            node_platform: darwin-arm64
            builder: dist:mac
            region: intl
          - platform: macos-x64
            os: macos-15-intel
            arch: x64
            node_platform: darwin-x64
            builder: dist:mac
            region: cn
          - platform: macos-x64
            os: macos-15-intel
            arch: x64
            node_platform: darwin-x64
            builder: dist:mac
            region: intl

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared SDK
        run: npm run build:sdk

      - name: Verify Desktop source
        run: npm run typecheck --workspace arcane-desktop

      - name: Import Apple signing certificate (macOS)
        if: ${{ startsWith(matrix.platform, 'macos') }}
        env:
          ARCANE_MAC_CERT_P12: ${{ secrets.ARCANE_MAC_CERT_P12 }}
          ARCANE_MAC_CERT_PASSWORD: ${{ secrets.ARCANE_MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/arcane-developer-id.p12"
          keychain="$RUNNER_TEMP/arcane-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$ARCANE_MAC_CERT_P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$ARCANE_MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert_path"
          security find-identity -v -p codesigning "$keychain"

      - name: Configure Apple notarization credentials (macOS)
        if: ${{ startsWith(matrix.platform, 'macos') }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build package (${{ matrix.platform }})
        env:
          ARCANE_BUNDLED_NODE_PLATFORM: ${{ matrix.node_platform }}
          ARCANE_BUILD_REGION: ${{ matrix.region }}
        run: npm run ${{ matrix.builder }} --workspace arcane-desktop -- --${{ matrix.arch }}

      - name: Notarize and staple DMG (macOS)
        if: ${{ startsWith(matrix.platform, 'macos') }}
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist
          for dmg in *.dmg; do
            # electron-builder notarizes only the .app; the dmg container needs its own submission and ticket
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Verify packaged resources
        shell: bash
        run: |
          set -euo pipefail
          app_dir="apps/desktop/dist/mac-arm64/ArcaneDesk.app/Contents/Resources/app"
          if [[ "${{ matrix.platform }}" == "macos-x64" ]]; then
            app_dir="apps/desktop/dist/mac/ArcaneDesk.app/Contents/Resources/app"
          fi
          test -d "$app_dir"
          node apps/desktop/scripts/verify-package.mjs \
            "$app_dir" $runtime_flag \
            --expected-node-platform "${{ matrix.node_platform }}" \
            --expected-region "${{ matrix.region }}"
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            suffix=""
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then suffix="-arm64"; fi
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
              "apps/desktop/dist/mac${suffix}/ArcaneDesk.app/Contents/Info.plist"
          fi

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staging/${{ matrix.platform }}"
          cd apps/desktop/dist
          shopt -s nullglob
          # 国际化方案 D5（评审 P4 修复）：intl 产物文件名是 -<arch>-intl.<ext>，
          # 后缀插在 arch 与扩展名之间；按 region 拼精确模式，错 flavor 宁可 0 件报错。
          suffix=""
          if [[ "${{ matrix.region }}" == "intl" ]]; then suffix="-intl"; fi
          copied=0
          for ext in dmg zip; do
            for file in *.${ext}; do
              case "$file" in
                *-${{ matrix.arch }}${suffix}.*)
                  cp "$file" "$GITHUB_WORKSPACE/staging/${{ matrix.platform }}/"
                  copied=$((copied + 1))
                  ;;
              esac
            done
          done
          cd "$GITHUB_WORKSPACE/staging/${{ matrix.platform }}"
          if [[ "$copied" -ne 2 ]]; then
            echo "expected exactly two package artifacts for ${{ matrix.platform }}, copied $copied" >&2
            exit 1
          fi
          packages=( *.dmg *.zip *.exe )
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/write-sha256sums.mjs" \
            SHA256SUMS.txt "${packages[@]}"
          ls -la

      - name: Attest Desktop artifact provenance
        uses: actions/attest@v4
        with:
          subject-checksums: staging/${{ matrix.platform }}/SHA256SUMS.txt

      - name: Upload build artifact (mac)
        if: ${{ startsWith(matrix.platform, 'macos') }}
        uses: actions/upload-artifact@v7
        with:
          name: arcane-desk-${{ matrix.platform }}-${{ matrix.region }}-${{ github.sha }}
          path: staging/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 7
