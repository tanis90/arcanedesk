name: Release Arcane Desktop

# Official four-platform Desktop build and release entrypoint. Dispatch with
# skip_oss=true for a build-only validation. Immutable OSS objects are uploaded
# and fully verified before latest.json may be changed.
# 国际化方案 D5 发布双轨：每个平台构建 cn（OSS arcane-package）与 intl
# （Cloudflare R2 arcane-desk-intl / dl.arcanedesk.app）两个 flavor，intl 包名
# 带 -intl 后缀、默认 releaseId 带 -intl 后缀，两侧 latest 指针互不影响。
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id (default: <version>-<commit8>)"
        required: false
        type: string
      channel:
        description: "Release channel"
        required: true
        default: private-beta
        type: string
      update_latest:
        description: "Update desktop/arcane-desk/latest.json after verification"
        required: true
        default: true
        type: boolean
      create_github_release:
        description: "Create a GitHub Release with the same artifacts"
        required: true
        default: true
        type: boolean
      skip_oss:
        description: "Build-only validation (no OSS upload)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arcane-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCANE_RELEASE_CHANNEL: ${{ inputs.channel || 'private-beta' }}
  RELEASE_CHANNEL: ${{ inputs.channel || 'private-beta' }}
  RELEASE_ID: ${{ inputs.release_id || '' }}
  UPDATE_LATEST: ${{ inputs.update_latest || false }}
  CREATE_GITHUB_RELEASE: ${{ inputs.create_github_release || false }}

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.region }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ARCANE_RELEASE_ID: ${{ inputs.release_id }}
      ARCANE_SOURCE_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
            arch: arm64
            node_platform: darwin-arm64
            builder: dist:mac
            region: cn
          - platform: macos-arm64
            os: macos-14
            arch: arm64
            node_platform: darwin-arm64
            builder: dist:mac
            region: intl
          - platform: macos-x64
            os: macos-15-intel
            arch: x64
            node_platform: darwin-x64
            builder: dist:mac
            region: cn
          - platform: macos-x64
            os: macos-15-intel
            arch: x64
            node_platform: darwin-x64
            builder: dist:mac
            region: intl
          - platform: windows-x64
            os: windows-latest
            arch: x64
            node_platform: win-x64
            builder: dist:win
            region: cn
          - platform: windows-x64
            os: windows-latest
            arch: x64
            node_platform: win-x64
            builder: dist:win
            region: intl
          - platform: windows-arm64
            os: windows-latest
            arch: arm64
            node_platform: win-arm64
            builder: dist:win
            region: cn
          - platform: windows-arm64
            os: windows-latest
            arch: arm64
            node_platform: win-arm64
            builder: dist:win
            region: intl

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared SDK
        run: npm run build:sdk

      - name: Verify Desktop source
        run: npm run typecheck --workspace arcane-desktop

      - name: Import Apple signing certificate (macOS)
        if: ${{ startsWith(matrix.platform, 'macos') }}
        env:
          ARCANE_MAC_CERT_P12: ${{ secrets.ARCANE_MAC_CERT_P12 }}
          ARCANE_MAC_CERT_PASSWORD: ${{ secrets.ARCANE_MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/arcane-developer-id.p12"
          keychain="$RUNNER_TEMP/arcane-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$ARCANE_MAC_CERT_P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$ARCANE_MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert_path"
          security find-identity -v -p codesigning "$keychain"

      - name: Configure Apple notarization credentials (macOS)
        if: ${{ startsWith(matrix.platform, 'macos') }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build package (${{ matrix.platform }})
        env:
          ARCANE_BUNDLED_NODE_PLATFORM: ${{ matrix.node_platform }}
          ARCANE_BUILD_REGION: ${{ matrix.region }}
          # Windows has no signing certificate configured; macOS uses the Developer ID pinned in package.json
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ contains(matrix.platform, 'windows') && 'false' || 'true' }}
        run: npm run ${{ matrix.builder }} --workspace arcane-desktop -- --${{ matrix.arch }}

      - name: Notarize and staple DMG (macOS)
        if: ${{ startsWith(matrix.platform, 'macos') }}
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist
          for dmg in *.dmg; do
            # electron-builder notarizes only the .app; the dmg container needs its own submission and ticket
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Verify packaged resources
        shell: bash
        run: |
          set -euo pipefail
          app_dir="apps/desktop/dist/win-unpacked/resources/app"
          runtime_flag=""
          if [[ "${{ matrix.platform }}" == "macos-arm64" ]]; then
            app_dir="apps/desktop/dist/mac-arm64/ArcaneDesk.app/Contents/Resources/app"
          elif [[ "${{ matrix.platform }}" == "macos-x64" ]]; then
            app_dir="apps/desktop/dist/mac/ArcaneDesk.app/Contents/Resources/app"
          elif [[ "${{ matrix.platform }}" == "windows-arm64" ]]; then
            app_dir="apps/desktop/dist/win-arm64-unpacked/resources/app"
            runtime_flag="--runtime-from-manifest"
          fi
          test -d "$app_dir"
          node apps/desktop/scripts/verify-package.mjs \
            "$app_dir" $runtime_flag \
            --expected-node-platform "${{ matrix.node_platform }}" \
            --expected-region "${{ matrix.region }}"
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            suffix=""
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then suffix="-arm64"; fi
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
              "apps/desktop/dist/mac${suffix}/ArcaneDesk.app/Contents/Info.plist"
          fi

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staging/${{ matrix.platform }}"
          cd apps/desktop/dist
          shopt -s nullglob
          copied=0
          for ext in dmg zip exe; do
            for file in *.${ext}; do
              case "$file" in
                *-${{ matrix.arch }}.*)
                  cp "$file" "$GITHUB_WORKSPACE/staging/${{ matrix.platform }}/"
                  copied=$((copied + 1))
                  ;;
              esac
            done
          done
          cd "$GITHUB_WORKSPACE/staging/${{ matrix.platform }}"
          if [[ "$copied" -ne 2 ]]; then
            echo "expected exactly two package artifacts for ${{ matrix.platform }}, copied $copied" >&2
            exit 1
          fi
          packages=( *.dmg *.zip *.exe )
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/write-sha256sums.mjs" \
            SHA256SUMS.txt "${packages[@]}"
          ls -la

      - name: Attest Desktop artifact provenance
        uses: actions/attest@v4
        with:
          subject-checksums: staging/${{ matrix.platform }}/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: arcane-desk-${{ matrix.platform }}-${{ matrix.region }}-${{ github.sha }}
          path: staging/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.region }} (+ optional GitHub Release)
    needs: build
    if: ${{ !inputs.skip_oss }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        region: [cn, intl]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Audit production dependencies and generate release SBOM
        shell: bash
        run: |
          npm audit --omit=dev
          mkdir -p release-audit
          npm sbom --package-lock-only --omit=dev --sbom-format=cyclonedx > release-audit/sbom.cdx.json

      - name: Regenerate release manifest at pinned commit
        env:
          ARCANE_SOURCE_COMMIT: ${{ github.sha }}
          ARCANE_BUILD_REGION: ${{ matrix.region }}
        shell: bash
        run: |
          set -euo pipefail
          # 显式 release_id 在 intl 腿加 -intl 后缀，避免与 cn 的 GitHub tag/版本目录撞名
          release_id="$RELEASE_ID"
          if [[ "${{ matrix.region }}" == "intl" && -n "$release_id" && "$release_id" != *-intl ]]; then
            release_id="${release_id}-intl"
          fi
          if [[ -n "$release_id" ]]; then export ARCANE_RELEASE_ID="$release_id"; fi
          npm run prepare:desktop-release --workspace arcane-desktop

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: arcane-desk-*-${{ matrix.region }}-*
          merge-multiple: false

      - name: Flatten staging into platform directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-staging
          for dir in staging/arcane-desk-*; do
            platform=$(basename "$dir" | sed -E 's/^arcane-desk-(.+)-(cn|intl)-[0-9a-f]{40}$/\1/')
            mkdir -p "publish-staging/$platform"
            cp "$dir"/* "publish-staging/$platform/"
          done
          find publish-staging -type f | sort

      - name: Publish immutable release (${{ matrix.region }})
        env:
          OSS_RELEASE_KEY_ID: ${{ secrets.OSS_RELEASE_KEY_ID }}
          OSS_RELEASE_KEY_SECRET: ${{ secrets.OSS_RELEASE_KEY_SECRET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          # releaseId 以本腿 prepare 生成的 manifest 为准（已含 region 后缀规则）
          args=(--staging publish-staging --channel "$RELEASE_CHANNEL" --region "${{ matrix.region }}" --skip-latest)
          node apps/desktop/scripts/publish-release.mjs "${args[@]}"

      - name: Stage uniquely named GitHub Release assets
        if: ${{ inputs.create_github_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p github-release-assets
          asset_count=0
          for platform_dir in publish-staging/*; do
            platform=$(basename "$platform_dir")
            for source in "$platform_dir"/*; do
              name=$(basename "$source")
              if [[ "$name" == "SHA256SUMS.txt" ]]; then
                name="SHA256SUMS-${platform}${{ matrix.region == 'intl' && '-intl' || '' }}.txt"
              fi
              target="github-release-assets/$name"
              if [[ -e "$target" ]]; then
                echo "duplicate GitHub Release asset name: $name" >&2
                exit 1
              fi
              cp "$source" "$target"
              asset_count=$((asset_count + 1))
            done
          done
          if [[ "$asset_count" -ne 12 ]]; then
            echo "expected 12 GitHub Release assets, staged $asset_count" >&2
            exit 1
          fi

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.region }}" in
            intl) manifest_base="https://dl.arcanedesk.app/desktop/arcane-desk-intl" ;;
            *) manifest_base="https://arcane-package.oss-cn-beijing.aliyuncs.com/desktop/arcane-desk" ;;
          esac
          release_id=$(node -e "console.log(require('./apps/desktop/generated/desktop-release.json').releaseId)")
          release_flags=()
          if [[ "$RELEASE_CHANNEL" != "stable" ]]; then release_flags+=(--prerelease); fi
          printf -v release_notes '%s\n\n%s\n\n%s\n\n%s' \
            "Automated release (${{ matrix.region }})." \
            "Manifest: $manifest_base/releases/$release_id/release.json" \
            "macOS: signed with a Developer ID certificate and notarized by Apple. Drag ArcaneDesk into Applications and launch it normally." \
            "Windows: these builds are unsigned, so Microsoft Defender SmartScreen may warn on first launch; choose More info > Run anyway."
          gh release create "$release_id" \
            --title "Arcane Desk $release_id" \
            --notes "$release_notes" \
            --target "${{ github.sha }}" \
            "${release_flags[@]}" \
            github-release-assets/*

      - name: Promote verified release to latest (${{ matrix.region }})
        if: ${{ inputs.update_latest }}
        env:
          OSS_RELEASE_KEY_ID: ${{ secrets.OSS_RELEASE_KEY_ID }}
          OSS_RELEASE_KEY_SECRET: ${{ secrets.OSS_RELEASE_KEY_SECRET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          release_id=$(node -e "console.log(require('./apps/desktop/generated/desktop-release.json').releaseId)")
          node apps/desktop/scripts/publish-release.mjs --promote-release "$release_id" --region "${{ matrix.region }}"

      - name: Upload release metadata audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: arcane-desk-release-metadata-${{ matrix.region }}-${{ github.sha }}
          path: |
            apps/desktop/distribution/releases/*.json
            apps/desktop/distribution/desktop-latest*.json
            release-audit/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
