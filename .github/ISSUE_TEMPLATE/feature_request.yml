name: Feature request
description: Propose an improvement to the SDK, CLI, or Desktop application.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Foundry SDK
        - FVTT CLI
        - Desktop application
        - Documentation or build tooling
        - Cross-component
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result and, when relevant, the SDK contract.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: security
    attributes:
      label: Permission and write impact
      description: Does this add a privileged action, write to Foundry, expose data, or broaden agent capabilities?
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The proposal does not require distributing Foundry software or commercial content.
          required: true
        - label: The proposal treats Arcane Desk as an unofficial Foundry integration and does not imply endorsement.
          required: true
