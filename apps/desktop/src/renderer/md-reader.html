<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- CSP 对齐 index.html:default-src 'self' 让 KaTeX 字体与本地 vendor 资源照常加载
       (foundry-unavailable.html 的 default-src 'none' 会把公式渲染成方块,不能抄)。
       style-src 'unsafe-inline' 是 mermaid/KaTeX 注入 <style> 与内联样式的既有需要。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https: http:" />
  <title>ArcaneDesk</title>
  <script src="theme-init.js"></script>
  <script src="i18n-init.js"></script>
  <script src="../shared/i18n/messages.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="../../generated/renderer-assets/katex/dist/katex.min.css" />
  <link rel="stylesheet" href="../../generated/renderer-assets/highlightjs/cdn-assets/styles/nord.min.css" id="hljs-theme-dark" />
  <link rel="stylesheet" href="../../generated/renderer-assets/highlightjs/cdn-assets/styles/stackoverflow-light.min.css" id="hljs-theme-light" disabled />
  <link rel="stylesheet" href="markdown.css" />
  <style>
    /* ---------- tokens:与 chat 同一套命名,值按"读文档"重新定 ----------
       底色不另起表面色:右屏本来就是"一块地方",再叠卡片会显得像弹窗(§5.1)。 */
    :root {
      color-scheme: dark;
      --bg: #1c1915;
      --bg-soft: #23201c;
      --panel-2: #2e2b27;
      --border: #4a4640;
      --border-soft: #35322c;
      --text: #d1ccc2;
      --text-strong: #f2ede1;
      --muted: #aca79e;
      --faint: #6f6a62;
      --accent: #f2ede1;
      --accent-dim: #aca79e;
      --ring: rgba(242, 237, 225, 0.22);
      --err: #9e675b;
      --warn: #9a8666;
      --info: #758a8f;
      --code-bg: #100e0b;
      --code-fg: #c9c2b2;
      --scroll: #3a362f;
      --scroll-hover: #57503f;
      --mono: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
      --font-ui: "Segoe UI", "Microsoft YaHei", system-ui, "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      /* signature(§5.3,2026-09-11 修订):文档标题用衬线,层次靠字体不靠颜色。
         CJK 渐进增强:装了思源宋体的用好字体,没装的落系统宋体,大字号避开小字 hinting 短板 */
      --font-head: Georgia, "Palatino Linotype", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", SimSun, serif;
      /* 字阶:正文 15px 即舒适阅读下限,截断提示/错误页等辅助文案用 meta 档 */
      --fs-micro: 11.5px;
      --fs-meta: 13px;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f2ede1;
      --bg-soft: #eae3d0;
      --panel-2: #e2dbc6;
      --border: #cfc9b8;
      --border-soft: #ddd6c2;
      --text: #57503f;
      --text-strong: #16130f; /* 纸墨档墨色(与 chat / Arcanemap 同板) */
      --muted: #7e7767;
      --faint: #9d9788;
      --accent: #3f5f6b;
      --accent-dim: #758a8f;
      --ring: rgba(63, 95, 107, 0.20);
      --err: #7a2e22;
      --warn: #6b4f24;
      --info: #3f5f6b;
      --code-bg: #eae3d0;
      --code-fg: #4a4235;
      --scroll: #c6bda6;
      --scroll-hover: #57503f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.8 var(--font-ui);
      overflow: hidden;
    }
    button:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: 1px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .reader-scroll { scroll-behavior: auto; }
    }
    ::selection { background: var(--accent); color: var(--bg); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---------- 正文栏 ----------
       满铺:右屏常被分栏挤窄,再套 68ch 居中栏会让重心偏右(§5.2);
       横向 padding 随面板宽度 clamp,宽面板仍有适度留白 */
    .reader-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .md-doc {
      padding: 26px clamp(24px, 6%, 72px) 72px;
      overflow-wrap: break-word;
    }
    /* 窄栏时 padding 收得比 clamp 下限更紧,不出现横向滚动(§5.4) */
    @media (max-width: 720px) {
      .md-doc { padding: 18px 16px 56px; }
      .reader-notice { padding: 10px 16px 0; }
    }
    /* 文档里的标题需要比气泡里的更分级:arcaneMd 一律输出 h4,这里按位置给层次。
       安静化(评审 §10):标题回墨色(--text-strong 由 markdown.css 供给),层次交给衬线+字号;
       彩色只留 accent 一种且语义="可点"——此前标题蓝+链接青+code 胶囊三色并立被验收判为花哨。 */
    .md-doc h4 { font-family: var(--font-head); font-weight: 600; font-size: 18px; line-height: 1.5; letter-spacing: 0.01em; margin: 26px 0 8px; }
    .md-doc h4:first-child { margin-top: 0; }
    /* 标题里的 **强调** 颜色跟随标题,不被 strong 规则弹走 */
    .md-doc h4 strong { color: inherit; }
    /* 阅读器里唯一的强调 = accent = 可点(亮档暗青 / 暗档纸白);--info 退出阅读器(它仍是 chat 的链接色) */
    .md-doc a { color: var(--accent); }
    /* 行内 code 拆胶囊:DM 笔记里 `区域Z8` 式片段密度极高,底色+描边一屏几十个小色块。
       只留等宽字体作区分,颜色并入正文;pre.md-code > code 特异性更高,围栏内不受影响。 */
    .md-doc code { background: none; border: none; border-radius: 0; padding: 0 1px; color: inherit; font-size: 0.93em; }
    .md-doc .md-img { max-height: none; }

    /* ---------- 超限截断提示 / 错误页 ---------- */
    .reader-notice {
      padding: 10px clamp(24px, 6%, 72px) 0; /* 与 .md-doc 同一套 padding 方案 */
      color: var(--muted);
      font-size: var(--fs-meta);
    }
    .reader-error {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .reader-error p {
      max-width: 46ch;
      color: var(--muted);
      font-size: var(--fs-meta);
      line-height: 1.9;
    }
    /* 空态兜底:从未打开过文档时切换丸切过来的落点。不是错误,居中留白即可,
       语气对齐 foundry-empty(标题衬线 + 一句指引)。 */
    .reader-empty {
      flex: 1;
      display: grid;
      place-items: center;
      align-content: center;
      padding: 32px;
      text-align: center;
    }
    .reader-empty .empty-title {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 18px;
      color: var(--text-strong);
      margin-bottom: 8px;
    }
    .reader-empty .empty-body {
      max-width: 46ch;
      color: var(--muted);
      font-size: var(--fs-meta);
      line-height: 1.9;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p id="reader-notice" class="reader-notice" role="status" hidden></p>
  <main id="reader-scroll" class="reader-scroll">
    <article id="reader-doc" class="md-doc"></article>
  </main>
  <div id="reader-error" class="reader-error" role="alert" hidden><p></p></div>
  <div id="reader-empty" class="reader-empty" hidden>
    <p class="empty-title"></p>
    <p class="empty-body" role="status"></p>
  </div>
  <script src="../../generated/renderer-assets/marked/lib/marked.umd.js"></script>
  <script src="../../generated/renderer-assets/highlightjs/cdn-assets/highlight.min.js"></script>
  <script src="../../generated/renderer-assets/katex/dist/katex.min.js"></script>
  <script src="../../generated/renderer-assets/mermaid/dist/mermaid.min.js"></script>
  <script src="markdown.js"></script>
  <script src="md-reader.js"></script>
</body>
</html>
